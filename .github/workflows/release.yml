# Push a tag like v1.2.3 to publish snug-agent binaries on the GitHub release.
# The console's join script downloads them from
#   https://github.com/<owner>/<repo>/releases/latest/download/snug-agent-linux-<arch>
# (set AGENT_DOWNLOAD_URL on the console to host them on your own servers instead).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/agent
      - name: build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/snug-agent-linux-$arch ./cmd/snug-agent
          done
          (cd dist && sha256sum snug-agent-linux-* > SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # The server image (SnugKV + snug-agent + snugkv-secrets) for swarm stacks:
  # ghcr.io/<owner>/snugkv:<version> and :latest
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: names
        id: names
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr A-Z a-z)/snugkv" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
